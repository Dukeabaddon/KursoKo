stages:
  - test

image: node:22-bookworm

variables:
  CI: 'true'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

before_script:
  - npm ci

lint:
  stage: test
  script:
    - npm run lint
  allow_failure: true

build:
  stage: test
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

playwright:
  stage: test
  script:
    - npx playwright install --with-deps chromium
    - npx playwright test --project=chromium
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
      - test-results/
    expire_in: 3 days
